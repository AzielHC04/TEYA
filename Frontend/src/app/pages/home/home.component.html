<div class="home-container">

  <!-- CARRUSEL PROMOCIONAL (BANNER PRINCIPAL) -->
  <section class="banner-carousel-section">
    <div class="carousel-wrapper">
      <div 
        class="carousel-slide" 
        *ngFor="let banner of bannersPromocionales; let i = index"
        [class.active]="i === bannerActual"
      >
        <img [src]="banner.imagen" [alt]="banner.titulo" class="banner-img">
      </div>

      <!-- Controles de navegación del banner -->
      <button class="carousel-arrow prev" (click)="anteriorBanner()">&lsaquo;</button>
      <button class="carousel-arrow next" (click)="siguienteBanner()">&rsaquo;</button>

      <!-- Indicadores (Puntitos) -->
      <div class="carousel-dots">
        <span 
          *ngFor="let banner of bannersPromocionales; let i = index"
          [class.active]="i === bannerActual"
          (click)="seleccionarBanner(i)"
        ></span>
      </div>
    </div>
  </section>

  <!-- SECCIÓN: LOS MÁS COMPRADOS -->
  <section class="products-carousel-section">
    <div class="section-header-centered">
      <h2>Los más comprados</h2>
      <a routerLink="/products" class="see-more-link">Ver todos &rarr;</a>
    </div>

    <div class="horizontal-scroll">
      <app-product-card 
        *ngFor="let producto of masCompradosVisibles" 
        [producto]="producto">
      </app-product-card>
    </div>
  </section>

  <!-- SECCIÓN: ÚLTIMOS AGREGADOS -->
  <section class="products-carousel-section">
    <div class="section-header-centered">
      <h2>Últimos agregados</h2>
      <a routerLink="/products" class="see-more-link">Ver todos &rarr;</a>
    </div>

    <div class="horizontal-scroll">
      <app-product-card 
        *ngFor="let producto of ultimosAgregadosVisibles" 
        [producto]="producto">
      </app-product-card>
    </div>
  </section>

  <!-- BANNERS DE ANUNCIOS INFERIORES -->
  <section class="ads-section">
    <div class="ad-card ad-1">
      <div class="ad-content">
        <span class="ad-badge">KABNIA BIO</span>
        <h3>Nutrición Avanzada</h3>
        <p>Maximiza el rendimiento y la resistencia natural de tus cultivos.</p>
        <a routerLink="/products" class="btn-ad">Ver catálogo</a>
      </div>
    </div>
    <div class="ad-card ad-2">
      <div class="ad-content">
        <span class="ad-badge">ASESORÍA</span>
        <h3>Soporte Técnico</h3>
        <p>Contáctanos para recomendaciones específicas de aplicación.</p>
        <a routerLink="/nosotros" class="btn-ad">Conócenos</a>
      </div>
    </div>
  </section>

</div>s
