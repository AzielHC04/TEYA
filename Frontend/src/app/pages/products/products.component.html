<div class="products-page">

  <!-- HEADER DE LA PÁGINA -->
  <section class="page-header">
    <div class="header-content">
      <span class="badge-tag">Catálogo Completo</span>
      <h1>Nuestros Productos Bioagrícolas</h1>
      <p>Soluciones avanzadas formuladas para la nutrición, protección y regeneración de tus cultivos.</p>
    </div>
  </section>

  <!-- CONTENEDOR PRINCIPAL A ANCHO COMPLETO -->
  <div class="main-container">

    <!-- BARRA DE FILTROS SUPERIOR (PÍLDORAS) -->
    <div class="filters-bar">
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Todas'"
        (click)="filtrarPorCategoria('Todas')">
        Todas las Categorías
      </button>
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Microorganismos'"
        (click)="filtrarPorCategoria('Microorganismos')">
        Microorganismos
      </button>
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Fungicidas'"
        (click)="filtrarPorCategoria('Fungicidas')">
        Fungicidas
      </button>
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Insecticidas'"
        (click)="filtrarPorCategoria('Insecticidas')">
        Insecticidas
      </button>
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Adherentes'"
        (click)="filtrarPorCategoria('Adherentes')">
        Adherentes
      </button>
      <button 
        class="filter-pill" 
        [class.active]="categoriaSeleccionada === 'Antiestresantes'"
        (click)="filtrarPorCategoria('Antiestresantes')">
        Antiestresantes
      </button>
    </div>

    <!-- ENCABEZADO DEL CATÁLOGO -->
    <div class="catalog-header">
      <span>Mostrando <strong>{{ productosPaginados.length }}</strong> de <strong>{{ productosFiltrados.length }}</strong> productos</span>
    </div>

    <!-- GRID DE TARJETAS COMPARTIDAS -->
    <div class="products-grid">
      <app-product-card 
        *ngFor="let producto of productosPaginados" 
        [producto]="producto">
      </app-product-card>
    </div>

    <!-- BOTONES DE PAGINACIÓN -->
    <div class="pagination-container" *ngIf="totalPaginas > 1">
      <button 
        class="btn-pagination" 
        [disabled]="paginaActual === 1"
        (click)="cambiarPagina(paginaActual - 1)">
        &larr; Anterior
      </button>

      <span class="page-indicator">Página {{ paginaActual }} de {{ totalPaginas }}</span>

      <button 
        class="btn-pagination" 
        [disabled]="paginaActual === totalPaginas"
        (click)="cambiarPagina(paginaActual + 1)">
        Siguiente &rarr;
      </button>
    </div>

  </div>
</div>
