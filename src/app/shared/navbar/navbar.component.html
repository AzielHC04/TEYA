<header class="navbar-header">
  <div class="navbar-container">

    <!-- Logo y marca -->
    <a routerLink="/" class="navbar-brand">
      <span class="brand-badge">🌱</span>
      <span class="brand-text">
        TEYA
        <small>Bioproductos</small>
      </span>
    </a>

    <!-- Navegación principal -->
    <nav class="navbar-nav">
      <ul>

        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
          >
            Inicio
          </a>
        </li>

        <!-- Menú de productos -->
        <li class="dropdown">

          <a
            routerLink="/products"
            routerLinkActive="active"
            class="nav-item dropdown-toggle"
          >
            Productos
            <span class="arrow">▾</span>
          </a>

          <ul class="dropdown-menu">
            <li>
              <a 
                routerLink="/products" 
                [queryParams]="{ categoria: 'organicos' }"
              >
                Orgánicos
              </a>
            </li>

            <li>
              <a 
                routerLink="/products" 
                [queryParams]="{ categoria: 'bioestimulantes' }"
              >
                Bioestimulantes
              </a>
            </li>

            <li>
              <a 
                routerLink="/products" 
                [queryParams]="{ categoria: 'nutricion-liquida' }"
              >
                Nutrición Líquida
              </a>
            </li>

            <li>
              <a 
                routerLink="/products" 
                [queryParams]="{ categoria: 'especialidades' }"
              >
                Especialidades
              </a>
            </li>

            <li>
              <a 
                routerLink="/products" 
                [queryParams]="{ categoria: 'bioplaguicidas' }"
              >
                Bioplaguicidas
              </a>
            </li>
          </ul>

        </li>

        <li>
          <a
            routerLink="/nosotros"
            routerLinkActive="active"
            class="nav-item"
          >
            Nosotros
          </a>
        </li>

        <li>
          <a
            routerLink="/carrito"
            routerLinkActive="active"
            class="nav-item cart-item"
          >
            Carrito
          </a>
        </li>

      </ul>
    </nav>

    <!-- Acción de contacto -->
    <div class="navbar-actions">
      <a
        routerLink="/contacto"
        class="btn-contact"
      >
        Contacto
      </a>
    </div>

  </div>
</header>
